name: Windows macOS and Android packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      include_alternatives:
        description: Include the Windows portable ZIP and unsigned Android APK
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: ${{ matrix.target }} · Craft bundle and smoke test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-2022
          - target: macos
            os: macos-15
            # The primary cache can publish an incomplete manifest while rebuilding.
            cache_url: https://ftp.gwdg.de/pub/linux/kde/extrafiles/craft/Qt6/
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Select Xcode with a supported macOS SDK
        if: matrix.target == 'macos'
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Prepare the Python trust store
        run: python -m pip install certifi pefile==2024.8.26 macholib==1.16.3
      - name: Build the desktop package with Qt and KDE dependencies
        env:
          METEO_CRAFT_CACHE_URL: ${{ matrix.cache_url }}
        run: python scripts/build-portable.py --target "${{ matrix.target }}" --work-dir "${{ runner.temp }}/MeteoBuild" --craft-root "${{ runner.temp }}/MeteoCraft" ${{ inputs.include_alternatives && '--include-alternatives' || '' }}
      - name: Preserve native renderer comparisons
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meteo-pl-renderers-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/MeteoBuild/rendering-artifacts/
          if-no-files-found: ignore
      - name: Preserve the installer and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meteo-pl-${{ matrix.target }}-${{ runner.arch }}-${{ github.sha }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error
          compression-level: 0
  android:
    name: Android arm64 · APK with Qt and KDE dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the persistent Android signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then exit 0; fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/meteo-signing.keystore"
          echo "METEO_ANDROID_KEYSTORE=$RUNNER_TEMP/meteo-signing.keystore" >> "$GITHUB_ENV"
      - name: Build and verify the APK
        id: build_apk
        env:
          METEO_ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          METEO_ANDROID_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_STORE_PASSWORD || '' }}
          METEO_ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: python3 scripts/build-portable.py --target android ${{ inputs.include_alternatives && '--include-alternatives' || '' }}
      - name: Remove the signing key
        if: always() && github.event_name != 'pull_request'
        run: rm -f "$RUNNER_TEMP/meteo-signing.keystore"
      - name: Prepare a disposable Android emulator
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator" "platform-tools" "system-images;android-35;google_apis_playstore;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name meteo-ci --path "$RUNNER_TEMP/meteo-ci.avd" --package "system-images;android-35;google_apis_playstore;x86_64"
          echo "hw.keyboard=yes" >> "$RUNNER_TEMP/meteo-ci.avd/config.ini"
          mkdir -p build/android-runtime
          "$ANDROID_HOME/emulator/emulator" -avd meteo-ci -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -cores 2 -memory 4096 -gpu swiftshader_indirect -qemu -cpu host > build/android-runtime/emulator.log 2>&1 &
          adb wait-for-device
          for attempt in $(seq 1 90); do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell input keyevent KEYCODE_MENU
      - name: Exercise the actual signed APK
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          report = json.loads(Path("dist/android/BUILD-REPORT.json").read_text())
          packages = [name for name in report["artifacts"] if name.endswith(("-signed.apk", "-development.apk"))]
          if len(packages) != 1: raise SystemExit("Expected one verified, signed runtime APK")
          subprocess.run([sys.executable, "scripts/android-runtime.py", "--serial", "emulator-5554",
                          "--apk", "dist/android/" + packages[0]], check=True)
          PY
      - name: Preserve Android runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meteo-pl-android-runtime-${{ github.sha }}
          path: build/android-runtime/
          if-no-files-found: ignore
      - name: Preserve APKs and checksums
        if: always() && steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meteo-pl-android-arm64-${{ github.sha }}
          path: dist/android/
          if-no-files-found: error
          # Qt leaves native libraries uncompressed for direct mmap on Android.
          # Compress the transport archive while preserving the signed APK bytes.
          compression-level: 6
