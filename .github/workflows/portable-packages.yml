name: Windows macOS and Android packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: ${{ matrix.target }} · Craft bundle and smoke test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-2022
          - target: macos
            os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare the Python trust store
        run: python -m pip install certifi
      - name: Build the desktop package with Qt and KDE dependencies
        run: python scripts/build-portable.py --target "${{ matrix.target }}" --work-dir "${{ runner.temp }}/MeteoBuild" --craft-root "${{ runner.temp }}/MeteoCraft"
      - name: Preserve the installer and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meteo-pl-${{ matrix.target }}-${{ runner.arch }}-${{ github.sha }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error
          compression-level: 0
  android:
    name: Android arm64 · APK with Qt and KDE dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify a development APK
        run: python3 scripts/build-portable.py --target android
      - name: Preserve APKs and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meteo-pl-android-arm64-${{ github.sha }}
          path: dist/android/
          if-no-files-found: error
          compression-level: 0
