name: Build, test and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: ${{ matrix.distro }} · tests and package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, debian, ubuntu, fedora]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Build and run all tests in the target distribution
        run: python3 scripts/build-package.py --distro "${{ matrix.distro }}" --test --jobs 2
      - name: Install and verify the native package
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          docker run --rm --init --shm-size=512m \
            -v "$PWD:/source:ro" -v "$PWD/dist/$DISTRO:/out:ro" \
            "meteo-pl-build:$DISTRO" bash -euc '
              case "$(. /etc/os-release; echo "$ID")" in
                debian|ubuntu) apt-get update; apt-get install -y /out/*.deb ;;
                fedora) dnf install -y /out/*.rpm ;;
                arch) pacman -U --noconfirm /out/*.pkg.tar.zst ;;
              esac
              cd /out
              sha256sum --check SHA256SUMS
              xvfb-run --auto-servernum dbus-run-session -- python3 /source/scripts/check-installed.py
            '
      - name: Preserve packages and checksums
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meteo-pl-${{ matrix.distro }}-${{ github.sha }}
          path: dist/${{ matrix.distro }}/
          if-no-files-found: error
          compression-level: 0
      - name: Preserve test reports and renderer comparisons
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tests-${{ matrix.distro }}-${{ github.sha }}
          path: |
            build/packages/${{ matrix.distro }}/build/test-results.xml
            build/packages/${{ matrix.distro }}/build/Testing/Temporary/
            build/packages/${{ matrix.distro }}/build/renderer-diffs/
          if-no-files-found: warn
