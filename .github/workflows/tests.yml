name: Build, test and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: ${{ matrix.distro }} · tests and package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, debian, ubuntu, fedora]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and run all tests in the target distribution
        run: python3 scripts/build-package.py --distro "${{ matrix.distro }}" --test --jobs 2
      - name: Install and verify the native package in a clean runtime image
        run: python3 scripts/check-package-runtime.py --distro "${{ matrix.distro }}"
      - name: Preserve packages and checksums
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meteo-pl-${{ matrix.distro }}-${{ github.sha }}
          path: dist/${{ matrix.distro }}/
          if-no-files-found: error
          compression-level: 0
      - name: Preserve test reports and renderer comparisons
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.distro }}-${{ github.sha }}
          path: |
            build/packages/${{ matrix.distro }}/build/test-results.xml
            build/packages/${{ matrix.distro }}/build/Testing/Temporary/
            build/packages/${{ matrix.distro }}/build/renderer-diffs/
            build/packages/${{ matrix.distro }}/build/tests/plasma-artifacts/
          if-no-files-found: warn
