name: macOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Select Xcode with a supported macOS SDK
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Prepare the Python trust store
        run: python -m pip install certifi pefile==2024.8.26 macholib==1.16.3
      - name: Build the desktop package with Qt and KDE dependencies
        env:
          METEO_CRAFT_CACHE_URL: https://ftp.gwdg.de/pub/linux/kde/extrafiles/craft/Qt6/
        run: python scripts/build-portable.py --target "macos" --work-dir "${{ runner.temp }}/MeteoBuild" --craft-root "${{ runner.temp }}/MeteoCraft"
      - name: Preserve native renderer comparisons
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meteo-pl-renderers-macos-${{ github.sha }}
          path: ${{ runner.temp }}/MeteoBuild/rendering-artifacts/
          if-no-files-found: ignore
      - name: Preserve the installer and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meteo-pl-macos-${{ runner.arch }}-${{ github.sha }}
          path: dist/macos/
          if-no-files-found: error
          compression-level: 0
